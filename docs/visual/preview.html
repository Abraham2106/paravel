<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paravel — guía UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Guía temporal. Paleta Cursor y grupos Notion: UI.md */
  :root {
    --radius: 6px;
    --font-sans: "IBM Plex Sans", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: #0f0f0f;
    --sidebar: #121212;
    --panel: #171717;
    --card: #171717;
    --card-hover: #1d1d1d;
    --elev: #1d1d1d;
    --line: #2a2a2a;
    --line-strong: #3a3a3a;
    --text: #ececec;
    --text-bright: #f5f5f5;
    --muted: #8b8b8b;
    --faint: #5c5c5c;
    --accent: #6f8dff;
    --accent-soft: rgba(111, 141, 255, 0.10);
    --ok: #7dcea0;
    --warn: #c4a35a;
    --bad: #d97a7a;
    --focus: #9db0ff;
    --scrim: rgba(0, 0, 0, 0.55);
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --sidebar: #f7f7f5;
    --panel: #fbfbfa;
    --card: #ffffff;
    --card-hover: #f4f4f2;
    --elev: #efefed;
    --line: #e9e9e7;
    --line-strong: #d4d4d1;
    --text: #37352f;
    --text-bright: #191918;
    --muted: #6b6b68;
    --faint: #8b8b87;
    --accent: #4a6ee0;
    --accent-soft: rgba(74, 110, 224, 0.09);
    --ok: #0f7b6c;
    --warn: #b7832c;
    --bad: #c4554d;
    --focus: #4a6ee0;
    --scrim: rgba(15, 15, 15, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 var(--font-sans);
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  svg { display: block; flex-shrink: 0; }

  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 240px;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0; overflow-y: auto;
    user-select: none;
  }
  .sidebar-header {
    padding: 14px 14px 10px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; border-radius: 4px;
    margin: 4px 6px 0;
  }
  .sidebar-header:hover { background: var(--elev); }
  .sidebar-header .avatar {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  .sidebar-header .name {
    font-weight: 600; font-size: 13px;
    color: var(--text-bright);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sidebar-header .chev { margin-left: auto; color: var(--muted); }

  .sidebar-nav { padding: 8px 6px 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 6px 8px;
    border-radius: 4px; color: var(--muted);
    font-size: 13px; font-weight: 500;
    text-align: left;
  }
  .nav-item:hover { background: var(--elev); color: var(--text); }
  .nav-item.active { background: var(--elev); color: var(--text-bright); }

  .sidebar-section { margin-top: 12px; padding: 0 6px; }
  .sidebar-section-title {
    padding: 0 8px 5px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint);
    display: flex; align-items: center; gap: 4px;
    cursor: pointer; user-select: none;
  }
  .sidebar-section-title:hover { color: var(--muted); }
  .sidebar-section-title .tw { transition: transform .15s; color: var(--faint); }
  .sidebar-section.collapsed .tw { transform: rotate(-90deg); }
  .sidebar-section.collapsed .spaces-list { display: none; }
  .space-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 5px 8px;
    border-radius: 4px; color: var(--muted);
    font-size: 13px;
    text-align: left;
  }
  .space-item:hover { background: var(--elev); color: var(--text); }
  .space-item.active { background: var(--elev); color: var(--text-bright); }
  .space-item .hb {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); flex-shrink: 0;
  }
  .space-item .hb.warn { background: var(--warn); }
  .space-item .hb.bad { background: var(--bad); }
  .space-item .hb.unknown { background: var(--faint); }
  .space-item .badge {
    margin-left: auto;
    font-size: 9.5px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--ok);
    padding: 1px 6px; border-radius: 3px;
    border: 1px solid rgba(125, 206, 160, 0.28);
    background: rgba(125, 206, 160, 0.07);
  }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0; min-height: 40px;
  }
  .breadcrumbs {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--muted);
    min-width: 0; overflow: hidden;
  }
  .breadcrumbs > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .breadcrumbs .b { color: var(--text); font-weight: 500; }
  .breadcrumbs .sep { color: var(--faint); flex-shrink: 0; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .top-actions button {
    padding: 5px 10px; border-radius: 5px;
    color: var(--muted); font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .top-actions button:hover { background: var(--elev); color: var(--text); }
  .host-status {
    font-family: var(--font-mono);
    font-size: 11px !important;
    padding: 4px 10px !important;
    border: 1px solid var(--line) !important;
    border-radius: 999px !important;
  }
  .host-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok);
  }
  .host-status.off .dot { background: var(--bad); }
  .host-status.off { color: var(--bad) !important; }

  .content { flex: 1; overflow-y: auto; padding: 36px 56px 96px; position: relative; }

  .gallery-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 28px; gap: 20px;
  }
  .gallery-header .htxt { flex: 1; min-width: 0; }
  .gallery-header h1 {
    margin: 0; font-size: 32px; font-weight: 600;
    color: var(--text-bright); letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .gallery-header p {
    margin: 10px 0 0; font-size: 13.5px; color: var(--muted);
    line-height: 1.5; max-width: 560px;
  }
  .view-toggles {
    display: flex; gap: 2px;
    background: var(--card); padding: 3px;
    border-radius: 6px; border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .view-toggles button {
    padding: 5px 12px; border-radius: 4px;
    font-size: 12px; color: var(--muted); font-weight: 500;
  }
  .view-toggles button.active { background: var(--elev); color: var(--text-bright); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 16px;
  }
  .space-card {
    position: relative;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden;
    cursor: pointer;
    display: flex; flex-direction: column;
    padding: 16px;
    outline: none;
    min-height: 164px;
  }
  .space-card::before {
    content: ""; position: absolute;
    left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--ok);
  }
  .space-card[data-h="bad"]::before { background: var(--bad); }
  .space-card[data-h="warn"]::before { background: var(--warn); }
  .space-card[data-h="unknown"]::before { background: var(--line-strong); }
  .space-card:hover, .space-card:focus-visible {
    border-color: var(--line-strong);
    background: var(--card-hover);
  }
  .space-card.kb-focus { border-color: var(--accent); }

  .space-card .card-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .space-card .card-head .ico { color: var(--muted); }
  .space-card .card-title {
    font-size: 15px; font-weight: 600;
    color: var(--text-bright);
    margin: 0; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .space-card .card-head .kind {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--faint);
  }
  .space-card .card-desc {
    font-size: 13px; color: var(--muted);
    line-height: 1.55; flex: 1;
  }
  .space-card .card-foot {
    display: flex; align-items: center; gap: 8px;
    padding-top: 12px; margin-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--faint);
  }
  .space-card .card-foot .lbl {
    font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; font-size: 10px;
  }
  .space-card .card-foot .pcs {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted);
  }
  .space-card .card-foot .bot-tag {
    color: var(--ok);
    border: 1px solid rgba(125, 206, 160, 0.28);
    background: rgba(125, 206, 160, 0.06);
    padding: 1px 6px; border-radius: 3px;
    font-weight: 600; font-size: 10px; letter-spacing: 0.04em;
  }

  .space-table { width: 100%; border-collapse: collapse; }
  .space-table th {
    text-align: left;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--faint);
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .space-table td {
    padding: 10px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    vertical-align: middle;
  }
  .space-table tbody tr { cursor: pointer; }
  .space-table tbody tr:hover td { background: var(--elev); }
  .space-table .name { color: var(--text-bright); font-weight: 500; }
  .space-table .hb {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); margin-right: 8px;
  }
  .space-table .hb.bad { background: var(--bad); }
  .space-table .hb.unknown { background: var(--faint); }

  .space-detail { max-width: 820px; margin: 0 auto; }
  .space-head {
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .space-head .kicker {
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .space-head .kicker .hb {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
  }
  .space-head .kicker .hb.warn { background: var(--warn); }
  .space-head .kicker .hb.bad { background: var(--bad); }
  .space-head .kicker .hb.unknown { background: var(--faint); }
  .space-title {
    display: flex; align-items: center; gap: 14px;
    margin: 0 0 12px;
  }
  .space-title .ico-lg { color: var(--muted); }
  .space-title h1 {
    font-size: 28px; font-weight: 600;
    color: var(--text-bright); margin: 0;
    letter-spacing: -0.02em; line-height: 1.15;
  }
  .space-head .desc {
    font-size: 14px; color: var(--muted);
    line-height: 1.55; max-width: 620px;
    margin: 0;
  }
  .space-meta {
    display: flex; flex-wrap: wrap; gap: 24px;
    margin-top: 18px;
  }
  .space-meta .m { display: flex; flex-direction: column; gap: 4px; }
  .space-meta .m .l {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--faint);
  }
  .space-meta .m .v { font-size: 13px; color: var(--text); }

  .group-bar {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px;
    align-items: center;
  }
  .group-bar .lbl {
    font-size: 10.5px; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.06em;
    font-weight: 600; margin-right: 4px;
  }
  .grp-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .grp-btn:hover { color: var(--text); border-color: var(--line-strong); }
  .grp-btn.active {
    border-color: var(--text-bright);
    color: var(--text-bright);
  }
  .grp-btn .ct {
    color: var(--faint); font-size: 11px; margin-left: 4px;
    font-weight: 400;
  }
  .grp-btn.active .ct { color: var(--muted); }

  .pieces-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    margin-bottom: 32px;
  }

  .piece-tile {
    position: relative;
    display: flex; align-items: flex-start; gap: 12px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 6px;
    padding: 13px 14px;
    text-align: left;
    cursor: pointer;
    user-select: none;
    opacity: 0.65;
  }
  .piece-tile:hover { background: var(--card); opacity: 0.9; }
  .piece-tile[aria-pressed="true"] {
    background: var(--card);
    border-color: var(--accent);
    opacity: 1;
  }
  .piece-tile[aria-pressed="true"]:hover { background: var(--card-hover); }
  .piece-tile.running { border-color: var(--warn); }
  .piece-tile.ok { border-color: var(--ok); }
  .piece-tile.rejected { border-color: var(--bad); }

  .piece-check {
    width: 18px; height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--line-strong);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    pointer-events: none;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .piece-tile[aria-pressed="true"] .piece-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .piece-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .piece-head { display: flex; align-items: center; gap: 8px; }
  .piece-icon { color: var(--faint); flex-shrink: 0; }
  .piece-tile[aria-pressed="true"] .piece-icon { color: var(--muted); }
  .piece-name {
    font-weight: 600; font-size: 14px;
    color: var(--muted);
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .piece-tile[aria-pressed="true"] .piece-name { color: var(--text-bright); }

  .piece-hb {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok);
    flex-shrink: 0;
  }
  .piece-hb.warn { background: var(--warn); }
  .piece-hb.bad { background: var(--bad); }
  .piece-hb.unknown { background: var(--faint); }

  .piece-meta {
    font-size: 10.5px; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .piece-target {
    font-family: var(--font-mono);
    font-size: 10.5px; color: var(--faint);
    line-height: 1.5;
    word-break: break-all;
    margin-top: 2px;
  }
  .piece-tile[aria-pressed="true"] .piece-target { color: var(--muted); }
  .piece-target.bad { color: var(--warn); }

  .piece-mini {
    position: absolute;
    right: 10px; bottom: 10px;
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--elev);
    border: 1px solid var(--line-strong);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    z-index: 2;
  }
  .piece-tile:hover .piece-mini { opacity: 1; }
  .piece-mini:hover { background: var(--text-bright); color: var(--bg); border-color: var(--text-bright); }

  .spinner { width: 14px; height: 14px; animation: spin .8s linear infinite; }
  .spinner circle {
    fill: none; stroke: var(--warn);
    stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 20 40;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .invite-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    color: var(--muted);
    font-size: 12.5px;
    margin-bottom: 22px;
    display: flex; align-items: flex-start; gap: 12px;
    line-height: 1.5;
  }
  .invite-box .ib-icon { color: var(--muted); flex-shrink: 0; margin-top: 1px; }
  .invite-box b { color: var(--text); font-weight: 600; }
  .invite-box .main-txt { flex: 1; min-width: 0; }
  .invite-box .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .invite-box .btn-sm {
    padding: 5px 12px; border-radius: 5px;
    font-size: 12px; font-weight: 500;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--bg);
  }
  .invite-box .btn-sm:hover { color: var(--text); border-color: var(--line-strong); }
  .invite-box .btn-sm.primary {
    background: var(--text-bright); color: var(--bg); border-color: var(--text-bright);
  }
  .invite-box .pack-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .invite-box .pack-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 2px 8px;
    border-radius: 4px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--line);
  }

  .play-bar {
    position: sticky; bottom: 0;
    margin: 0 -56px;
    padding: 14px 56px 22px;
    display: flex; justify-content: flex-end;
    align-items: center; gap: 14px;
    background: var(--bg);
    pointer-events: none;
    z-index: 3;
  }
  .play-bar.hidden { display: none; }
  .play-bar .preview {
    display: flex; align-items: center; gap: 10px;
    pointer-events: auto;
    font-size: 12.5px;
    color: var(--muted);
  }
  .play-bar .preview .num { color: var(--text-bright); font-weight: 600; }
  .play-bar .preview .rej {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--warn);
    border: 1px solid rgba(196,163,90,0.3);
    background: rgba(196,163,90,0.06);
    padding: 3px 10px; border-radius: 5px;
    font-weight: 500; font-size: 11.5px;
    cursor: help;
  }
  .play-btn {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
    background: var(--text-bright); color: var(--bg);
    padding: 10px 20px; border-radius: 6px;
    font-weight: 600; font-size: 13px;
  }
  .play-btn:hover:not(:disabled) { opacity: 0.92; }
  .play-btn:disabled { background: var(--elev); color: var(--faint); cursor: default; }
  .play-btn.busy { background: var(--warn); color: #111; }
  .play-btn.done { background: var(--ok); color: #111; }
  .play-btn .play-label {
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;
  }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 56px 24px; color: var(--muted);
    font-size: 13.5px; gap: 14px;
    text-align: center;
  }
  .empty-state .ghost {
    width: 100%; max-width: 620px;
    opacity: 0.35;
    pointer-events: none;
    text-align: left;
  }
  .empty-state .hint { color: var(--faint); font-size: 12.5px; margin-top: 8px; }

  .log-entry {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .log-entry.ok { border-left: 2px solid var(--ok); }
  .log-entry.rejected { border-left: 2px solid var(--bad); }
  .log-entry header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 11px;
    color: var(--faint);
  }
  .log-entry header .rid { color: var(--muted); font-weight: 500; }
  .log-entry header .dur { color: var(--faint); }
  .log-entry header .st {
    margin-left: auto; letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 600;
  }
  .log-entry.ok header .st { color: var(--ok); }
  .log-entry.rejected header .st { color: var(--bad); }
  .log-entry pre {
    margin: 0; padding: 10px 14px;
    font-family: var(--font-mono); font-size: 11.5px;
    line-height: 1.6; color: var(--muted);
    white-space: pre-wrap; word-break: break-all;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .log-entry pre:last-child { border-bottom: 0; }
  .log-entry pre b { color: var(--text); font-weight: 500; }
  .log-entry .why { color: var(--warn); }
  .log-entry .copy, .log-entry .replay {
    position: absolute; top: 8px;
    background: var(--bg); border: 1px solid var(--line);
    color: var(--muted); border-radius: 4px;
    padding: 2px 8px; font-size: 10px;
    font-family: var(--font-sans); letter-spacing: 0.04em;
    text-transform: uppercase; font-weight: 600;
    opacity: 0;
  }
  .log-entry .copy { right: 8px; }
  .log-entry .replay { right: 68px; }
  .log-entry pre:hover .copy, .log-entry pre:hover .replay { opacity: 1; }
  .log-entry .copy:hover, .log-entry .replay:hover { color: var(--text); border-color: var(--line-strong); }

  .log-drawer {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 44vh; min-height: 300px;
    background: var(--sidebar);
    border-top: 1px solid var(--line-strong);
    transform: translateY(100%);
    transition: transform .2s ease;
    z-index: 40;
    display: flex; flex-direction: column;
  }
  .log-drawer.open { transform: translateY(0); }
  .log-drawer header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .log-drawer header h3 {
    margin: 0; font-size: 12px; font-weight: 600;
    color: var(--text-bright);
    font-family: var(--font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .log-drawer header .cnt {
    font-size: 11px; color: var(--faint);
    font-family: var(--font-mono);
  }
  .log-drawer header .filters {
    margin-left: auto;
    display: flex; gap: 6px; align-items: center;
  }
  .log-drawer select {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 8px;
    font-size: 11.5px; color: var(--text);
  }
  .log-drawer .close {
    width: 26px; height: 26px;
    border-radius: 5px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .log-drawer .close:hover { background: var(--elev); color: var(--text); }
  .log-drawer .body {
    flex: 1; overflow-y: auto;
    padding: 12px 20px 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .log-drawer .empty { color: var(--faint); font-size: 12.5px; text-align: center; padding: 24px 0; }

  .cto-panel {
    width: 320px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .cto-panel header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .cto-panel header h2 {
    margin: 0; font-size: 12px; font-weight: 600;
    color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .cto-panel header h2 .ico { color: var(--muted); }
  .cto-messages {
    flex: 1; overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .cto-msg { max-width: 92%; }
  .cto-msg.me { align-self: flex-end; }
  .cto-msg .who {
    font-family: var(--font-mono);
    font-size: 9.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--faint);
    margin-bottom: 4px;
  }
  .cto-msg.me .who { text-align: right; }
  .cto-msg .bubble {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 10px 13px;
    font-size: 12.5px; color: var(--text);
    line-height: 1.5;
  }
  .cto-msg.me .bubble {
    background: var(--elev); border-color: var(--line-strong);
  }
  .cto-msg .bubble b { color: var(--text-bright); font-weight: 600; }

  .orch {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 8px;
  }
  .orch .lane {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 12px;
  }
  .orch .lane .lbl {
    font-family: var(--font-mono);
    font-size: 9.5px; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.08em;
    width: 62px; flex-shrink: 0;
  }
  .orch .lane .nm { color: var(--text-bright); font-weight: 600; font-size: 12.5px; }
  .orch .flow {
    text-align: center; color: var(--faint);
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .orch .pack {
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    display: flex; flex-wrap: wrap; gap: 5px;
    align-items: center;
  }
  .orch .pack .plbl {
    font-size: 10px; color: var(--faint);
    font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-right: 4px;
  }
  .orch .pack .pk {
    font-size: 10.5px; padding: 2px 8px;
    border-radius: 4px;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--line);
  }

  .cto-chips {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 6px 16px 12px;
  }
  .cto-chip {
    background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px;
    font-size: 11.5px; color: var(--muted);
  }
  .cto-chip:hover { background: var(--elev); color: var(--text); border-color: var(--line-strong); }

  .cto-input {
    display: flex; gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
  }
  .cto-input input {
    flex: 1; background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px; font-size: 13px; min-width: 0;
  }
  .cto-input input:focus { outline: none; border-color: var(--accent); }
  .cto-input input::placeholder { color: var(--faint); }
  .cto-input button {
    background: var(--text-bright); color: var(--bg);
    padding: 8px 14px; border-radius: 6px;
    font-weight: 600; font-size: 12.5px;
  }
  .cto-input button:hover { opacity: 0.9; }

  .scrim {
    position: fixed; inset: 0;
    background: var(--scrim);
    display: flex; align-items: center; justify-content: center;
    z-index: 80;
    opacity: 0; pointer-events: none;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--sidebar);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    width: 520px; max-width: calc(100vw - 40px);
    max-height: calc(100vh - 80px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .modal header .htxt { flex: 1; }
  .modal header h2 {
    margin: 0; font-size: 15px; font-weight: 600;
    color: var(--text-bright);
    display: flex; align-items: center; gap: 8px;
  }
  .modal header p {
    margin: 6px 0 0; font-size: 12.5px;
    color: var(--muted); line-height: 1.5;
  }
  .modal header .close {
    width: 26px; height: 26px;
    border-radius: 5px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .modal header .close:hover { background: var(--elev); color: var(--text); }
  .modal .body { flex: 1; overflow-y: auto; padding: 16px 22px; }
  .modal footer {
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .modal .btn {
    padding: 7px 14px; border-radius: 6px;
    font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--bg);
  }
  .modal .btn:hover { color: var(--text); border-color: var(--line-strong); }
  .modal .btn.primary {
    background: var(--text-bright); color: var(--bg); border-color: var(--text-bright);
  }
  .modal .btn.primary:disabled { background: var(--elev); color: var(--faint); border-color: var(--line); cursor: default; }

  .pack-list { display: flex; flex-direction: column; gap: 6px; }
  .pack-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .pack-row:hover { border-color: var(--line-strong); }
  .pack-row.on { border-color: var(--accent); background: var(--accent-soft); }
  .pack-row .ck {
    width: 18px; height: 18px;
    border-radius: 4px; border: 1.5px solid var(--line-strong);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: transparent; flex-shrink: 0;
  }
  .pack-row.on .ck { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pack-row .ic { color: var(--muted); }
  .pack-row .info { flex: 1; min-width: 0; }
  .pack-row .nm { font-weight: 600; font-size: 13.5px; color: var(--text-bright); }
  .pack-row .mt {
    font-family: var(--font-mono);
    font-size: 10.5px; color: var(--faint);
    margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pack-note {
    margin-top: 14px; padding: 11px 13px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px; color: var(--muted);
    line-height: 1.5;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .pack-note svg { color: var(--warn); margin-top: 1px; flex-shrink: 0; }
  .pack-note b { color: var(--text); font-weight: 600; }

  .cmdk {
    width: 560px; max-width: calc(100vw - 40px);
    background: var(--sidebar);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    overflow: hidden;
    align-self: flex-start;
    margin-top: 12vh;
  }
  .cmdk input {
    width: 100%; padding: 15px 20px;
    background: transparent; border: 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px; color: var(--text); outline: none;
  }
  .cmdk input::placeholder { color: var(--faint); }
  .cmdk .list { max-height: 340px; overflow-y: auto; padding: 6px; }
  .cmdk .item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 6px;
    font-size: 13px; color: var(--text); cursor: pointer;
  }
  .cmdk .item .ic { color: var(--muted); }
  .cmdk .item.sel { background: var(--elev); }
  .cmdk .item .kat {
    margin-left: auto; font-size: 10.5px;
    color: var(--faint); text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .cmdk .empty { padding: 30px; text-align: center; color: var(--faint); font-size: 13px; }

  .toasts {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px;
    z-index: 90; pointer-events: none;
  }
  .toast {
    background: var(--elev);
    border: 1px solid var(--line-strong);
    color: var(--text);
    padding: 10px 16px; border-radius: 6px;
    font-size: 13px;
    pointer-events: auto;
    display: flex; align-items: center; gap: 8px;
    max-width: 90vw;
  }
  .toast .ic { color: var(--muted); }
  .toast.ok .ic { color: var(--ok); }
  .toast.bad .ic { color: var(--bad); }

  .mock-banner {
    position: fixed; left: 252px; bottom: 16px; right: auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--sidebar);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px 5px 10px;
    font-size: 11px;
    color: var(--faint);
    z-index: 50;
    pointer-events: none;
    user-select: none;
  }
  .mock-banner .d {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn);
  }
  .mock-banner b { color: var(--muted); font-weight: 500; }

  @media (max-width: 1100px) {
    .cto-panel { width: 290px; }
    .content { padding: 32px 36px 90px; }
    .play-bar { margin: 0 -36px; padding: 14px 36px 22px; }
  }
  @media (max-width: 900px) {
    .sidebar { width: 200px; }
    .cto-panel { display: none; }
  }
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .content { padding: 24px 16px 88px; }
    .play-bar { margin: 0 -16px; padding: 12px 16px 16px; }
    .mock-banner { left: 12px; }
    .gallery-header h1 { font-size: 24px; }
    .space-title h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebar-header"></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div id="sidebar-spaces"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="top-actions">
        <button id="btn-theme" title="Cambiar tema"></button>
        <button id="btn-cmdk" title="Comandos (⌘K)">
          <span style="font-family:var(--font-mono); font-size:11px;">⌘K</span>
        </button>
        <button id="btn-log" title="Log del host (Ctrl+`)">Log</button>
        <button class="host-status" id="hostbtn"></button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>

  <aside class="cto-panel">
    <header>
      <h2><span class="ico" id="cto-ico"></span> CTO</h2>
    </header>
    <div class="cto-messages" id="cto-messages"></div>
    <div class="cto-chips" id="cto-chips"></div>
    <form class="cto-input" id="cto-form">
      <input id="cto-input" type="text" autocomplete="off" placeholder="En qué andas…" aria-label="Mensaje al CTO" />
      <button type="submit">Enviar</button>
    </form>
  </aside>

</div>

<div class="log-drawer" id="log-drawer">
  <header>
    <h3>Host · Log</h3>
    <span class="cnt" id="log-count"></span>
    <div class="filters">
      <select id="log-f-status">
        <option value="all">status: all</option>
        <option value="ok">status: ok</option>
        <option value="rejected">status: rejected</option>
      </select>
      <select id="log-f-kind">
        <option value="all">kind: all</option>
      </select>
    </div>
    <button class="close" id="log-close" title="Cerrar">✕</button>
  </header>
  <div class="body" id="log-body"></div>
</div>

<div class="scrim" id="modal-scrim">
  <div class="modal" id="modal"></div>
</div>

<div class="scrim" id="cmdk-scrim">
  <div class="cmdk">
    <input id="cmdk-input" placeholder="Escribe un comando…" autocomplete="off" />
    <div class="list" id="cmdk-list"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<div class="mock-banner">
  <span class="d"></span>
  <span><b>guía UI</b> · mock host · no abre apps</span>
</div>

<script src="preview.js"></script>
</body>
</html>
