[package]
name = "paravel-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Paravel contributors"]

[dependencies]
axum = "0.8"
base64 = "0.22"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
paravel-context = { path = "../paravel-context" }
rand = "0.9"
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "time", "net", "macros", "signal"] }
tower = { version = "0.5", features = ["limit", "util"] }
url = "2"
uuid = "1"

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
